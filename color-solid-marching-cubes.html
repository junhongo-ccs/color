<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sRGB Color Solid — Marching Cubes</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 56px; left: 12px; z-index: 10;
    color: #fff; font: 13px system-ui, sans-serif;
    background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px;
    line-height: 1.8;
  }
  button {
    font: inherit; margin-right: 8px; padding: 4px 10px;
    border: 0; border-radius: 6px; cursor: pointer;
  }
  #axisLabel { color: #bbb; }
  /* 共通ヘッダー：一覧へ戻るリンクとページ切替 */
  #siteHeader {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 44px; box-sizing: border-box; padding: 0 12px;
    display: flex; align-items: center; gap: 16px;
    background: rgba(17,17,17,.85); border-bottom: 1px solid #2c2c2c;
    font: 13px system-ui, sans-serif;
  }
  #siteHeader a { color: #bbb; text-decoration: none; white-space: nowrap; }
  #siteHeader a:hover { color: #fff; }
  #siteHeader .home { color: #fff; font-weight: 600; }
  #siteHeader nav { display: flex; gap: 4px; overflow-x: auto; }
  #siteHeader nav a { padding: 4px 10px; border-radius: 6px; }
  #siteHeader nav a[aria-current="page"] { background: #2c2c2c; color: #fff; }
</style>
</head>
<body>

<header id="siteHeader">
  <a class="home" href="index.html">← sRGB 色立体</a>
  <nav>
    <a href="color-solid.html">点群</a>
    <a href="color-solid-mesh.html">外殻メッシュ</a>
    <a href="color-solid-marching-cubes.html" aria-current="page">Marching Cubes</a>
    <a href="compare-color-solids.html">比較</a>
  </nav>
</header>

<div id="ui">
  <button id="toggleSpace">表示: xyY</button>
  <button id="toggleShade">陰影: ON</button>
  <button id="toggleRotate">自動回転: ON</button>
  <span>ドラッグ: 回転 ／ ホイール: ズーム ／ 右ドラッグ: パン</span><br />
  <span id="axisLabel"></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";

// ------------------------------------------------------------
// 1. 色変換（表示座標 → XYZ → 線形RGB）
// ------------------------------------------------------------
// CIE XYZ -> 線形 sRGB(D65)
const M_INV = [
  [ 3.2404542, -1.5371385, -0.4985314],
  [-0.9692660,  1.8760108,  0.0415560],
  [ 0.0556434, -0.2040259,  1.0572252]
];

function xyzToLinear([X, Y, Z]) {
  return M_INV.map((row) => row[0] * X + row[1] * Y + row[2] * Z);
}

// D65 白色点
const WHITE_XYZ = [0.95047, 1.0, 1.08883];

const DELTA = 6 / 29;
function labFInv(t) {
  return t > DELTA ? t * t * t : 3 * DELTA * DELTA * (t - 4 / 29);
}

// 表示座標の割り当ては点群版・メッシュ版と同じ。
// 明るさ（Y / L*）は -1.5〜4.5、色度 y と b* は -Z 方向。
// 各関数は表示座標を XYZ に戻す（定義できない場所は null）。
const SPACES = {
  xyY: {
    axes: "横: 色度 x ／ 縦: 輝度 Y ／ 奥行: 色度 y",
    toXYZ(wx, wy, wz) {
      const x = wx / 8 + 0.33;
      const y = -wz / 8 + 0.33;
      const Y = (wy + 1.5) / 6;
      if (y < 1e-4) return null;
      return [(x * Y) / y, Y, ((1 - x - y) * Y) / y];
    }
  },
  CIELAB: {
    axes: "横: a*（緑→赤） ／ 縦: L* ／ 奥行: b*（青→黄）",
    toXYZ(wx, wy, wz) {
      const L = ((wy + 1.5) / 6) * 100;
      const a = wx / 0.025;
      const b = -wz / 0.025;
      const fy = (L + 16) / 116;
      return [
        WHITE_XYZ[0] * labFInv(fy + a / 500),
        WHITE_XYZ[1] * labFInv(fy),
        WHITE_XYZ[2] * labFInv(fy - b / 200)
      ];
    }
  }
};

// ------------------------------------------------------------
// 2. スカラー場を作る
//
// 各ボクセルの位置を線形RGBに戻し、RGB立方体の内側への深さ
//   f = min(r, g, b, 1-r, 1-g, 1-b)
// を場の値にする。f > 0 が色域の内側、f = 0 の等値面が色域の境界。
// これを Marching Cubes で三角形メッシュにする。
// ------------------------------------------------------------
const RESOLUTION = 64;           // ボクセル解像度。上げると滑らかだが重い
const CENTER = [0, 1.5, 0];      // 表示空間でのボリュームの中心
const HALF = 3.4;                // ボリュームの半径（-1〜1 → ±HALF）

const size = RESOLUTION;
const size3 = size * size * size;

function buildField(toXYZ) {
  const field = new Float32Array(size3);
  const palette = new Float32Array(size3 * 3);

  for (let z = 0; z < size; z++) {
    const wz = CENTER[2] + HALF * ((z - size / 2) / (size / 2));
    for (let y = 0; y < size; y++) {
      const wy = CENTER[1] + HALF * ((y - size / 2) / (size / 2));
      for (let x = 0; x < size; x++) {
        const wx = CENTER[0] + HALF * ((x - size / 2) / (size / 2));
        const i = size * size * z + size * y + x;

        const xyz = toXYZ(wx, wy, wz);
        if (!xyz) {
          field[i] = -1;
          continue;
        }
        const [r, g, b] = xyzToLinear(xyz);
        // 色域から遠い場所は値が極端になるので -1 で頭打ちにする
        field[i] = Math.max(-1, Math.min(r, g, b, 1 - r, 1 - g, 1 - b));

        // 境界付近の外側ボクセルも、補間用に最寄りの色域内の色を持たせる。
        // three.js r152以降は頂点色をリニアとして扱うので線形値のまま入れる。
        palette[i * 3 + 0] = Math.min(1, Math.max(0, r));
        palette[i * 3 + 1] = Math.min(1, Math.max(0, g));
        palette[i * 3 + 2] = Math.min(1, Math.max(0, b));
      }
    }
  }
  return { field, palette };
}

const FIELDS = {
  xyY: buildField(SPACES.xyY.toXYZ),
  CIELAB: buildField(SPACES.CIELAB.toXYZ)
};

// ------------------------------------------------------------
// 3. Marching Cubes オブジェクト
// ------------------------------------------------------------
const shadedMaterial = new THREE.MeshLambertMaterial({ vertexColors: true });
// 光源の影響を受けず、色そのものを正確に見せる
const flatMaterial = new THREE.MeshBasicMaterial({ vertexColors: true });

const effect = new MarchingCubes(
  RESOLUTION,
  shadedMaterial,
  false,  // UV
  true,   // 頂点色
  120000  // 最大ポリゴン数
);
effect.isolation = 0;
effect.position.set(...CENTER);
effect.scale.setScalar(HALF);
effect.frustumCulled = false;

// 2つの場を k で混ぜて等値面を作り直す（k=0: from, k=1: to）
function applyField(from, to, k) {
  effect.reset(); // 法線キャッシュのクリアも兼ねる
  const f = effect.field;
  const p = effect.palette;
  for (let i = 0; i < size3; i++) {
    f[i] = from.field[i] + (to.field[i] - from.field[i]) * k;
  }
  for (let i = 0; i < size3 * 3; i++) {
    p[i] = from.palette[i] + (to.palette[i] - from.palette[i]) * k;
  }
  effect.update();
}

// ------------------------------------------------------------
// 4. シーン・カメラ・ライティング
// ------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(3.2, 3.7, 4.2);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(effect);
scene.add(new THREE.AxesHelper(2.5));

// 正面の明るさが元の色とほぼ同じになる強さ（r155以降は π で等倍）
scene.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.5));
// カメラに付けて、どこから見ても左上から光が当たるようにする
const keyLight = new THREE.DirectionalLight(0xffffff, Math.PI * 0.55);
keyLight.position.set(-2, 3, 4);
camera.add(keyLight);

// ------------------------------------------------------------
// 5. OrbitControls
// ------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0); // 立体の中心付近（明るさ 0〜1 → 表示 -1.5〜4.5）
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.5;
controls.maxDistance = 15;

// ------------------------------------------------------------
// 6. 色空間の切替（スカラー場どうしを補間して等値面をモーフィング）
// ------------------------------------------------------------
const MORPH_SECONDS = 0.9;
let currentSpace = "xyY";
let morphFrom = FIELDS.xyY;
let morphTo = FIELDS.xyY;
let morphT = 1;

applyField(morphFrom, morphTo, 1);

const spaceButton = document.getElementById("toggleSpace");
const axisLabel = document.getElementById("axisLabel");
axisLabel.textContent = SPACES.xyY.axes;

spaceButton.addEventListener("click", () => {
  currentSpace = currentSpace === "xyY" ? "CIELAB" : "xyY";
  // 切替途中で押された場合も、今の場から滑らかに向かう
  morphFrom = {
    field: effect.field.slice(),
    palette: effect.palette.slice()
  };
  morphTo = FIELDS[currentSpace];
  morphT = 0;
  spaceButton.textContent = `表示: ${currentSpace}`;
  axisLabel.textContent = SPACES[currentSpace].axes;
});

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function updateMorph(dt) {
  if (morphT >= 1) return;
  morphT = Math.min(1, morphT + dt / MORPH_SECONDS);
  applyField(morphFrom, morphTo, easeInOutCubic(morphT));
}

// ------------------------------------------------------------
// 7. アニメーションループ
// ------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  updateMorph(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ------------------------------------------------------------
// 8. ボタン
// ------------------------------------------------------------
const shadeButton = document.getElementById("toggleShade");
shadeButton.addEventListener("click", () => {
  const shaded = effect.material === shadedMaterial;
  effect.material = shaded ? flatMaterial : shadedMaterial;
  shadeButton.textContent = `陰影: ${shaded ? "OFF" : "ON"}`;
});

const rotateButton = document.getElementById("toggleRotate");
rotateButton.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate;
  rotateButton.textContent = `自動回転: ${controls.autoRotate ? "ON" : "OFF"}`;
});

// ------------------------------------------------------------
// 9. リサイズ対応
// ------------------------------------------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
