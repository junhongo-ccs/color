<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
// スペクトル軌跡のデータ（CIE、CC BY-SA 4.0。出典はデータファイルの先頭を参照）
import { SPECTRAL_LOCUS } from "./data/cie1931-spectral-locus.js";

// ============================================================
// 1. 色変換（他のページと同じ式。sRGB(D65) → XYZ → xyY）
// ============================================================
function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
const M = [
  [0.4124564, 0.3575761, 0.1804375],
  [0.2126729, 0.7151522, 0.0721750],
  [0.0193339, 0.1191920, 0.9503041]
];
const toXYZ = ([r, g, b]) => M.map((row) => row[0] * r + row[1] * g + row[2] * b);
function chromaticity([X, Y, Z]) {
  const s = X + Y + Z;
  return [X / s, Y / s];
}
const WHITE_XY = chromaticity(toXYZ([1, 1, 1]));

// xyY → 表示座標。床（Y = 0）が y = 0 で、立体の高さは HEIGHT
const HEIGHT = 6;
const toLocal = (x, y, Y) => new THREE.Vector3((x - 0.33) * 8, Y * HEIGHT, -(y - 0.33) * 8);

// ============================================================
// 2. 色立体の外殻（RGB 立方体の6面を xyY へ写す。color-solid-mesh.html と同じ構成）
// ============================================================
function buildShell(S = 40) {
  const positions = [], colors = [], indices = [];
  let count = 0;
  const push = (lin, chroma = lin) => {
    const Y = toXYZ(lin)[1];
    const [x, y] = chromaticity(toXYZ(chroma));
    const p = toLocal(x, y, Y);
    positions.push(p.x, p.y, p.z);
    colors.push(lin[0], lin[1], lin[2]);
    return count++;
  };
  const patch = (nu, nv, sample) => {
    const base = count;
    for (let j = 0; j <= nv; j++) {
      for (let i = 0; i <= nu; i++) {
        const { lin, chroma } = sample(i / nu, j / nv);
        push(lin, chroma);
      }
    }
    for (let j = 0; j < nv; j++) {
      for (let i = 0; i < nu; i++) {
        const a = base + j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
  };
  const toLinear = (enc) => enc.map(srgbToLinear);
  for (let k = 0; k < 3; k++) {
    const [p, q] = [0, 1, 2].filter((c) => c !== k);
    // 上側の面（チャンネル k = 1）
    patch(S, S, (u, v) => {
      const enc = [0, 0, 0];
      enc[k] = 1; enc[p] = u; enc[q] = v;
      return { lin: toLinear(enc) };
    });
    // 壁（チャンネル k = 0）を黒からの光線として張る
    patch(2 * S, S, (t, s) => {
      const enc = [0, 0, 0];
      enc[p] = t < 0.5 ? 1 : 2 - 2 * t;
      enc[q] = t < 0.5 ? 2 * t : 1;
      const edge = toLinear(enc);
      const sLin = srgbToLinear(s);
      return { lin: edge.map((c) => c * sLin), chroma: edge };
    });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  return g;
}

// ============================================================
// 3. シーン
// ============================================================
const canvas = document.getElementById("heroCanvas");
const stage = canvas.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);

// 立ち上がる部分（色立体と無彩色軸）。scale.y を 0 → 1 にして「明るさの軸を足す」
const solid = new THREE.Group();
solid.add(new THREE.Mesh(
  buildShell(),
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })
));
solid.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([toLocal(...WHITE_XY, 0), toLocal(...WHITE_XY, 1.04)]),
  new THREE.LineBasicMaterial({ color: 0xffffff })
));
scene.add(solid);

// 床：テキストの xy色度図と同じ方眼（0.1 刻み）と x 軸・y 軸
{
  const grid = [], axes = [];
  for (let v = 0; v <= 0.8001; v += 0.1) grid.push(toLocal(v, 0, 0), toLocal(v, 0.9, 0));
  for (let v = 0; v <= 0.9001; v += 0.1) grid.push(toLocal(0, v, 0), toLocal(0.8, v, 0));
  axes.push(toLocal(0, 0, 0), toLocal(0.85, 0, 0), toLocal(0, 0, 0), toLocal(0, 0.95, 0));
  const floor = new THREE.Group();
  floor.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(grid),
    new THREE.LineBasicMaterial({ color: 0x333333 })
  ));
  floor.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(axes),
    new THREE.LineBasicMaterial({ color: 0x8a8a8a })
  ));
  floor.position.y = -0.01; // 色度図の面とちらつかないよう、わずかに下げる
  scene.add(floor);
}

// スペクトル軌跡（単色光の色度を結んだ馬蹄形の線）と、純紫軌跡（両端の 380 nm と 780 nm を結ぶ線）。
// 人が見られるすべての色は、この2本で囲まれた範囲に入る。sRGB の三角形はその内側の一部
function makeLocus(toPoint) {
  const group = new THREE.Group();
  const points = SPECTRAL_LOCUS.map(([, x, y]) => toPoint(x, y));
  const spectral = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color: 0xd0d0d0, transparent: true })
  );
  // 純紫軌跡は単色光ではないので、破線で区別する
  const purple = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([points[points.length - 1], points[0]]),
    new THREE.LineDashedMaterial({ color: 0x9a9a9a, dashSize: 0.14, gapSize: 0.1, transparent: true })
  );
  purple.computeLineDistances();
  group.add(spectral, purple);
  return group;
}

scene.add(makeLocus((x, y) => toLocal(x, y, 0).setY(-0.005)));

// 主な波長の数字（白色点から外側へ少し離して置く）
function makeWavelengthLabel(nm, x, y) {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 64;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#a8a8a8";
  ctx.font = "40px 'BIZ UDPGothic', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(nm), 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(0.56, 0.28, 1);
  const out = new THREE.Vector2(x - WHITE_XY[0], y - WHITE_XY[1]).normalize().multiplyScalar(0.045);
  sprite.position.copy(toLocal(x + out.x, y + out.y, 0));
  scene.add(sprite);
}
for (const [nm, x, y] of SPECTRAL_LOCUS) {
  if ([460, 480, 500, 520, 540, 560, 580, 600, 620].includes(nm)) makeWavelengthLabel(nm, x, y);
}

// 軸の名前（x・y は床、Y は立ち上がる軸の先端）
function makeLabel(text) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#d0d0d0";
  ctx.font = "italic 88px Georgia, 'Times New Roman', serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.setScalar(0.55);
  scene.add(sprite);
  return sprite;
}
makeLabel("x").position.copy(toLocal(0.9, 0, 0));
makeLabel("y").position.copy(toLocal(0, 1.0, 0));
const labelY = makeLabel("Y");

// ============================================================
// 4. アニメーション：真上から見た色度図 → 明るさの軸が伸びて立体に
// ============================================================
const caption = document.getElementById("stageCaption");
const CAPTIONS = {
  flat: "真上から見ると、テキストでおなじみの xy色度図。馬蹄形がスペクトル軌跡、色のついた三角形が画面で出せる色です。",
  rise: "そこに、明るさ Y の軸を足していくと……",
  done: "画面で出せる色の範囲が、立体になりました。"
};
const HOLD = 1100, RISE = 2800;                 // ミリ秒
const PHI_TOP = 0.0008, PHI_END = 1.08;          // 真上 → 斜め上から
const THETA_END = -0.55;                         // 立ち上がりながら少し回り込む
const TARGET = new THREE.Vector3(0.2, 0, -0.6);  // スペクトル軌跡の馬蹄形の中心あたり
const RADIUS = 5.0;                              // 馬蹄形と立体の両方を包む球の半径

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let start = 0;
let finished = false;
let controls = null;

function fitDistance() {
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * Math.min(1, camera.aspect);
  return (RADIUS / Math.sin(Math.atan(tanHalf))) * 1.02;
}

// 進み具合 k（0〜1）に合わせて、立体の高さとカメラの位置を決める
function pose(k) {
  const s = Math.max(0.004, k); // 高さ 0 だと面が重なってちらつくので、わずかに残す
  solid.scale.y = s;
  labelY.position.copy(toLocal(...WHITE_XY, 1.04 * s)).add(new THREE.Vector3(0, 0.35, 0));
  labelY.material.opacity = Math.min(1, k * 3);

  const phi = PHI_TOP + (PHI_END - PHI_TOP) * k;
  const theta = THETA_END * k;
  const target = TARGET.clone().setY((HEIGHT / 2) * s);
  const d = fitDistance();
  camera.position.set(
    target.x + d * Math.sin(phi) * Math.sin(theta),
    target.y + d * Math.cos(phi),
    target.z + d * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
  return target;
}

function play() {
  finished = false;
  if (controls) controls.enabled = false;
  start = performance.now();
  caption.textContent = CAPTIONS.flat;
}

function finish() {
  finished = true;
  const target = pose(1);
  caption.textContent = CAPTIONS.done;
  // マウスなどで細かく操作できる環境だけ、ドラッグで回せるようにする
  // （タッチ端末ではページのスクロールを妨げないよう、回転操作は付けない）
  if (window.matchMedia("(pointer: fine)").matches) {
    if (!controls) {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
    }
    controls.target.copy(target);
    controls.enabled = true;
    controls.update();
  }
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (finished) finish();
}
new ResizeObserver(resize).observe(stage);
resize();

document.getElementById("replay").addEventListener("click", () => {
  if (reduceMotion) return;
  play();
});

function animate(now) {
  requestAnimationFrame(animate);
  if (!finished) {
    const t = now - start;
    if (t < HOLD) {
      pose(0);
    } else if (t < HOLD + RISE) {
      if (caption.textContent !== CAPTIONS.rise) caption.textContent = CAPTIONS.rise;
      pose(ease((t - HOLD) / RISE));
    } else {
      finish();
    }
  } else if (controls) {
    controls.update();
  }
  renderer.render(scene, camera);
}

// 動きを減らす設定のときは、立ち上がった状態から始める
if (reduceMotion) {
  document.getElementById("replay").hidden = true;
  finish();
} else {
  play();
}
requestAnimationFrame(animate);

// ============================================================
// 5. ページ一覧にマウスを乗せると、ヒーローの本文がそのページの紹介に変わる

// HTML の改行で文の間に空白が入らないよう、元の本文の改行を詰めておく
const defaultLead = lead.textContent.trim().replace(/\s*\n\s*/g, "");
lead.textContent = defaultLead;
let swapTimer = 0;

function showLead(text) {
  if (lead.textContent === text) return;
  clearTimeout(swapTimer);
  lead.classList.add("is-swapping");
  swapTimer = setTimeout(() => {
    lead.textContent = text;
    lead.classList.remove("is-swapping");
  }, reduceMotion ? 0 : 150);
}

for (const page of document.querySelectorAll(".page[data-lead]")) {
  page.addEventListener("pointerenter", () => showLead(page.dataset.lead));
  page.addEventListener("focus", () => showLead(page.dataset.lead));
  page.addEventListener("pointerleave", () => showLead(defaultLead));
  page.addEventListener("blur", () => showLead(defaultLead));
}
